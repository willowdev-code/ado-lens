name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore AdoLens.sln

      - name: Build
        run: dotnet build AdoLens.sln -c Release --no-restore

      - name: Test
        run: dotnet test AdoLens.sln -c Release --no-build --logger "console;verbosity=normal"

  # The packages as a release builds them: the ZIP, the Claude Desktop extension and the installer (Inno Setup).
  package:
    name: package
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Inno Setup
        shell: pwsh
        run: ./.github/install-inno.ps1

      - name: Package
        shell: powershell
        run: .\pack.ps1 -OutDir dist -Installer
