name: Feature request
description: An idea for a new tool or a better answer from an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the use case with neutral names — no work items, code or data from customer organizations.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The question you want Claude to answer, or the task you still do by hand in Azure DevOps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A new tool, a parameter, a different answer — whatever you have in mind.
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidential data
      options:
        - label: This request contains no work items, code or data from customer organizations.
          required: true
