name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting!

        **Please do not paste work items, wiki pages, code, names or any other data from your own or your customers'
        Azure DevOps organizations.** Reproduce the problem with neutral names (e.g. organization `contoso`,
        project `Demo`) or describe it in general terms.
        Security problems: use **Security → Report a vulnerability** instead of an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `adolens version`.
      placeholder: ado-lens 0.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool or command you used, with its parameters, and what you got.
      placeholder: |
        ado_fields type=Bug
        -> "no work item type 'Bug'", although ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status (optional)
      description: Output of `adolens status`. Replace organization, project and user names that belong to a customer.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, process (Agile / Scrum / CMMI / inherited), Git or TFVC, Claude Desktop or Claude Code.
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidential data
      options:
        - label: This report contains no work items, code, names or data from customer organizations.
          required: true
